worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    keepalive_timeout        65;
    keepalive_requests       1000;
    client_body_timeout      60s;
    client_header_timeout    10s;
    send_timeout             60s;
    client_max_body_size     2m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # High limits — actual enforcement in Python middleware
    limit_req_zone $binary_remote_addr zone=tts_zone:10m  rate=120r/m;
    limit_req_zone $binary_remote_addr zone=poll_zone:5m  rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    upstream tts_api {
        least_conn;
        server tts-api-1:8000 weight=1;
        server tts-api-2:8000 weight=1;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            proxy_pass         http://tts_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            access_log off;
        }

        # ── CRITICAL: 60s timeout on generate-audio ──────────
        location = /generate-audio {
            limit_req  zone=tts_zone burst=50 nodelay;
            limit_conn conn_zone 20;
            proxy_pass         http://tts_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /download/ {
            proxy_pass         http://tts_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_read_timeout 120s;
        }

        location / {
            limit_req zone=poll_zone burst=100 nodelay;
            proxy_pass         http://tts_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}